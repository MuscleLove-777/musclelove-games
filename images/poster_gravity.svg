<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- 上下の境界ライン -->
  <line x1="0" y1="3" x2="400" y2="3" stroke="#E94560" stroke-width="3"/>
  <line x1="0" y1="297" x2="400" y2="297" stroke="#E94560" stroke-width="3"/>
  <!-- 重力反転シンボル: 上下矢印 -->
  <g transform="translate(200,120)">
    <!-- 上向き矢印 -->
    <polygon points="0,-45 -18,-15 -8,-15 -8,0 8,0 8,-15 18,-15" fill="#FF6B6B"/>
    <!-- 下向き矢印 -->
    <polygon points="0,45 -18,15 -8,15 -8,0 8,0 8,15 18,15" fill="#FF6B6B" opacity="0.6"/>
    <!-- 中央の円(プレイヤー) -->
    <circle cx="0" cy="0" r="6" fill="#FF6B6B" opacity="0.9"/>
  </g>
  <!-- タイトルテキスト -->
  <text x="200" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="28" fill="#ffffff">筋肉重力反転</text>
  <!-- サブテキスト -->
  <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#aaaaaa">Muscle Gravity</text>
  <!-- ブランド -->
  <text x="200" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FF6B6B">MUSCLELOVE / POWER COLLECTION</text>
</svg>
