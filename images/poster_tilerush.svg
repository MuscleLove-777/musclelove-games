<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g transform="translate(110,60)">
    <!-- 3x3 grid background -->
    <rect x="0" y="0" width="180" height="180" rx="10" fill="#252545" stroke="#e94560" stroke-width="2" opacity="0.6"/>
    <!-- Tiles -->
    <rect x="6" y="6" width="52" height="52" rx="6" fill="#8b5cf6"/>
    <text x="32" y="28" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">💪</text>
    <text x="32" y="46" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">1</text>

    <rect x="64" y="6" width="52" height="52" rx="6" fill="#6366f1"/>
    <text x="90" y="28" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">🏋️</text>
    <text x="90" y="46" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">2</text>

    <rect x="122" y="6" width="52" height="52" rx="6" fill="#3b82f6"/>
    <text x="148" y="28" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">🦵</text>
    <text x="148" y="46" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">3</text>

    <rect x="6" y="64" width="52" height="52" rx="6" fill="#0ea5e9"/>
    <text x="32" y="86" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">🤸</text>
    <text x="32" y="104" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">4</text>

    <rect x="64" y="64" width="52" height="52" rx="6" fill="#10b981"/>
    <text x="90" y="86" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">🏃</text>
    <text x="90" y="104" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">5</text>

    <rect x="122" y="64" width="52" height="52" rx="6" fill="#f59e0b"/>
    <text x="148" y="86" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">💥</text>
    <text x="148" y="104" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">6</text>

    <rect x="6" y="122" width="52" height="52" rx="6" fill="#ef4444"/>
    <text x="32" y="144" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">🔥</text>
    <text x="32" y="162" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">7</text>

    <rect x="64" y="122" width="52" height="52" rx="6" fill="#e94560"/>
    <text x="90" y="144" fill="white" font-size="20" text-anchor="middle" font-family="system-ui" dominant-baseline="central">⚡</text>
    <text x="90" y="162" fill="white" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">8</text>

    <!-- Blank tile -->
    <rect x="122" y="122" width="52" height="52" rx="6" fill="#1a1a2e" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  </g>
  <!-- Title -->
  <text x="200" y="268" fill="url(#accent)" font-size="22" text-anchor="middle" font-family="system-ui" font-weight="800">MUSCLE TILE RUSH</text>
  <text x="200" y="290" fill="#8888aa" font-size="11" text-anchor="middle" font-family="system-ui">Slide Puzzle | 3x3 / 4x4 / 5x5</text>
</svg>
