<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- Grid background dots -->
  <g opacity="0.15">
    <circle cx="30" cy="30" r="3" fill="#fff"/>
    <circle cx="60" cy="30" r="3" fill="#fff"/>
    <circle cx="90" cy="30" r="3" fill="#fff"/>
    <circle cx="30" cy="60" r="3" fill="#fff"/>
    <circle cx="60" cy="60" r="3" fill="#fff"/>
    <circle cx="90" cy="60" r="3" fill="#fff"/>
    <circle cx="30" cy="90" r="3" fill="#fff"/>
    <circle cx="60" cy="90" r="3" fill="#fff"/>
    <circle cx="90" cy="90" r="3" fill="#fff"/>
  </g>

  <!-- Colored endpoint dots and paths -->
  <circle cx="30" cy="30" r="8" fill="#e53935"/>
  <circle cx="90" cy="90" r="8" fill="#e53935"/>
  <polyline points="30,30 30,60 60,60 60,90 90,90" fill="none" stroke="#e53935" stroke-width="5" opacity="0.7"/>

  <circle cx="90" cy="30" r="8" fill="#1e88e5"/>
  <circle cx="30" cy="90" r="8" fill="#1e88e5"/>
  <polyline points="90,30 90,60 60,60 60,90 30,90" fill="none" stroke="#1e88e5" stroke-width="5" opacity="0.7"/>

  <circle cx="60" cy="30" r="8" fill="#43a047"/>
  <circle cx="60" cy="90" r="8" fill="#43a047"/>
  <line x1="60" y1="30" x2="60" y2="90" stroke="#43a047" stroke-width="5" opacity="0.7"/>

  <!-- Title -->
  <text x="160" y="50" font-family="system-ui,sans-serif" font-size="28" font-weight="900" fill="#f0f0f0" text-anchor="middle">筋肉フロー</text>
  <text x="160" y="75" font-family="system-ui,sans-serif" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="3">MUSCLE FLOW</text>

  <!-- Subtitle -->
  <text x="160" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#a0a0b0" text-anchor="middle">同色ドットをつなぎ全マスを埋めろ！</text>

  <!-- Tags -->
  <rect x="100" y="130" width="120" height="24" rx="12" fill="rgba(0,240,255,0.15)" stroke="#00f0ff" stroke-width="1"/>
  <text x="160" y="146" font-family="system-ui,sans-serif" font-size="11" fill="#00f0ff" text-anchor="middle">パズル・頭脳</text>

  <!-- Bottom accent -->
  <line x1="0" y1="195" x2="320" y2="195" stroke="url(#bg)" stroke-width="2"/>
  <text x="160" y="185" font-family="system-ui,sans-serif" font-size="9" fill="#606080" text-anchor="middle">MuscleLove · 無料ブラウザゲーム</text>
</svg>
