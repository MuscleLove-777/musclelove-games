<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF2D3A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#222" stroke-width="0.5" opacity="0.5">
    <line x1="140" y1="40" x2="140" y2="260"/>
    <line x1="166" y1="40" x2="166" y2="260"/>
    <line x1="192" y1="40" x2="192" y2="260"/>
    <line x1="218" y1="40" x2="218" y2="260"/>
    <line x1="244" y1="40" x2="244" y2="260"/>
    <line x1="270" y1="40" x2="270" y2="260"/>
    <line x1="140" y1="66" x2="270" y2="66"/>
    <line x1="140" y1="92" x2="270" y2="92"/>
    <line x1="140" y1="118" x2="270" y2="118"/>
    <line x1="140" y1="144" x2="270" y2="144"/>
    <line x1="140" y1="170" x2="270" y2="170"/>
    <line x1="140" y1="196" x2="270" y2="196"/>
    <line x1="140" y1="222" x2="270" y2="222"/>
    <line x1="140" y1="248" x2="270" y2="248"/>
  </g>
  <!-- Board outline -->
  <rect x="140" y="40" width="130" height="220" fill="none" stroke="#444" stroke-width="1.5" rx="2"/>
  <!-- Falling T-piece -->
  <rect x="167" y="67" width="24" height="24" rx="3" fill="#ab47bc"/>
  <rect x="141" y="93" width="24" height="24" rx="3" fill="#ab47bc"/>
  <rect x="167" y="93" width="24" height="24" rx="3" fill="#ab47bc"/>
  <rect x="193" y="93" width="24" height="24" rx="3" fill="#ab47bc"/>
  <!-- Placed blocks row -->
  <rect x="141" y="235" width="24" height="24" rx="3" fill="#00e5ff"/>
  <rect x="167" y="235" width="24" height="24" rx="3" fill="#00e5ff"/>
  <rect x="193" y="235" width="24" height="24" rx="3" fill="#66bb6a"/>
  <rect x="219" y="235" width="24" height="24" rx="3" fill="#66bb6a"/>
  <rect x="245" y="235" width="24" height="24" rx="3" fill="#ef5350"/>
  <!-- Placed blocks row 2 -->
  <rect x="141" y="209" width="24" height="24" rx="3" fill="#ff9800"/>
  <rect x="219" y="209" width="24" height="24" rx="3" fill="#42a5f5"/>
  <rect x="245" y="209" width="24" height="24" rx="3" fill="#42a5f5"/>
  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="18" font-weight="bold">MUSCLE DROP FIT</text>
  <!-- Subtitle -->
  <text x="200" y="284" text-anchor="middle" fill="#888" font-family="system-ui,sans-serif" font-size="11">MuscleLove Games</text>
  <!-- Dumbbell icon left -->
  <g transform="translate(60,130)" fill="#FF2D3A" opacity="0.6">
    <rect x="0" y="8" width="6" height="14" rx="2"/>
    <rect x="6" y="4" width="4" height="22" rx="1"/>
    <rect x="10" y="12" width="20" height="6" rx="1"/>
    <rect x="30" y="4" width="4" height="22" rx="1"/>
    <rect x="34" y="8" width="6" height="14" rx="2"/>
  </g>
  <!-- Dumbbell icon right -->
  <g transform="translate(300,130)" fill="#FF2D3A" opacity="0.6">
    <rect x="0" y="8" width="6" height="14" rx="2"/>
    <rect x="6" y="4" width="4" height="22" rx="1"/>
    <rect x="10" y="12" width="20" height="6" rx="1"/>
    <rect x="30" y="4" width="4" height="22" rx="1"/>
    <rect x="34" y="8" width="6" height="14" rx="2"/>
  </g>
